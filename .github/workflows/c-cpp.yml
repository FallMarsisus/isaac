name: C/C++ CI

on:
  push:
    branches: [ "Antov2(caCommenceAFaireBeaucoup)" ]
  pull_request:
    branches: [ "Antov2(caCommenceAFaireBeaucoup)" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - name: install sdl
    - run: sudo apt install libsdl2-2.0-0 libsdl2-dev libsdl2-image-2.0-0 libsdl2-image-dev -y
    - name: make
      run: make
